ation", "Median", "Unique count", "Shape"]}, {"id": 99, "q": "Scenario: What does x>50 return?", "answer": "A Boolean array", "options": ["A Boolean array", "A single integer", "A string", "A sorted array"]}, {"id": 100, "q": "Scenario: Which operator means element-wise AND?", "answer": "&", "options": ["&", "and", "&&", "AND"]}, {"id": 101, "q": "Scenario: Which operator means element-wise OR?", "answer": "|", "options": ["|", "or", "||", "OR"]}, {"id": 102, "q": "Scenario: Which operator means element-wise NOT?", "answer": "~", "options": ["~", "not", "!", "NOT"]}, {"id": 103, "q": "Scenario: Why parenthesize compound comparisons?", "answer": "To control Boolean precedence", "options": ["To control Boolean precedence", "For speed", "NumPy requires strings", "To change dtype"]}, {"id": 104, "q": "Scenario: What does np.any(mask) mean?", "answer": "At least one True", "options": ["At least one True", "All True", "First value", "Sorted mask"]}, {"id": 105, "q": "Scenario: What does np.all(mask) mean?", "answer": "Every value is True", "options": ["Every value is True", "Any True", "Number of True values", "Indices"]}]};
const CONTENT={"01": "<p>NumPy is Python's core numerical-computing library. Its main object is the homogeneous multidimensional <b>ndarray</b>.</p><div class='code'>import numpy as np\nx=np.array([10,20,30])\nx.ndim\nx.shape\nx.size\nx.dtype</div>", "02": "<p>Use creation routines such as array, arange, linspace, zeros, ones and full.</p><div class='code'>np.array([1,2,3])\nnp.arange(0,10,2)\nnp.linspace(0,1,5)\nnp.zeros((2,3))\nnp.ones((2,3))\nnp.full((2,2),7)</div>", "03": "<p>For 2-D arrays use <code>a[row,column]</code>. Slices use <code>:</code>.</p><div class='code'>a[0,1]\na[:,1]\na[1,:]\na[1:3,0:2]\na[::-1]</div>", "04": "<p>Reshape changes dimensions while preserving element count.</p><div class='code'>x=np.arange(12)\nx.reshape(3,4)\nx.reshape(2,2,3)\nx.flatten()\nx.reshape(3,4).T</div>", "05": "<p>Vectorized arithmetic operates across arrays.</p><div class='code'>a=np.array([1,2,3])\nb=np.array([10,20,30])\na+b\na*2\nnp.sqrt(a)\nnp.power(a,2)</div>", "06": "<p>Aggregations summarize arrays. Axis controls the reduction direction.</p><div class='code'>a=np.array([[10,20,30],[40,50,60]])\nnp.sum(a)\nnp.mean(a)\nnp.min(a)\nnp.max(a)\nnp.std(a)\nnp.sum(a,axis=0)\nnp.sum(a,axis=1)</div>", "07": "<p>Comparisons return Boolean arrays.</p><div class='code'>scores=np.array([45,72,88,91])\nscores>70\nscores==88\nscores<=50\nscores!=72</div>", "08": "<p>Use <code>&amp;</code>, <code>|</code>, <code>~</code>, np.any and np.all.</p><div class='code'>passed=scores>=50\nexcellent=scores>=85\npassed &amp; excellent\npassed | excellent\n~passed\nnp.any(scores>90)\nnp.all(scores>=40)</div>", "09": "<p>Boolean masks directly filter arrays.</p><div class='code'>marks=np.array([32,48,67,81,93])\nmarks[marks>=50]\nmarks[(marks>=50)&amp;(marks<90)]</div>", "10": "<p>Descriptive statistics help you understand student data.</p><div class='code'>np.mean(marks)\nnp.median(marks)\nnp.percentile(marks,75)\nnp.var(marks)\nnp.std(marks)</div>", "11": "<p>Advanced Boolean logic: parenthesize each comparison and use NumPy logical functions for clarity.</p><div class='code'>mask=(marks>=50)&amp;(marks<90)\nnp.logical_and(marks>=50,marks<90)\nnp.logical_or(marks<40,marks>90)\nnp.logical_not(marks>=50)</div>", "12": "<p><code>np.where</code> performs conditional replacement or returns matching indices.</p><div class='code'>np.where(marks>=50,'Pass','Fail')\nnp.where(marks<50,0,marks)\nnp.where(marks>80)</div>", "13": "<p><code>np.unique</code> returns distinct values; counts and inverse mappings are optional.</p><div class='code'>np.unique(x)\nnp.unique(x,return_counts=True)\nnp.unique(x,return_inverse=True)</div>", "14": "<p>Use sort for values and argsort for sorting positions.</p><div class='code'>np.sort(x)\nnp.sort(x)[::-1]\nidx=np.argsort(x)\nx[idx]</div>", "15": "<p>argmax and argmin return indices of extreme values.</p><div class='code'>i=np.argmax(marks)\nj=np.argmin(marks)\nmarks[i]\nmarks[j]</div>", "16": "<p>Prefer the modern random generator API.</p><div class='code'>rng=np.random.default_rng(42)\nrng.integers(1,11,5)\nrng.random(5)\nrng.normal(70,10,5)\nrng.choice(['A','B','C'],5)</div>", "17": "<p>Broadcasting compares dimensions from right to left. Dimensions are compatible when equal or one is 1.</p><div class='code'>a=np.ones((2,3))\nb=np.array([1,2,3])\na+b\nc=np.array([[1],[2]])\na+c</div>", "18": "<p>Slices often create views. Use copy when independent storage is required.</p><div class='code'>x=np.array([1,2,3,4])\nview=x[1:3]\nview[0]=99\n# original x changed\ny=x.copy()\ny[0]=500\n# x unaffected</div>", "19": "<p>Combine arrays along existing axes.</p><div class='code'>np.concatenate((a,b))\nnp.column_stack((a,b))\nnp.row_stack((a,b))</div>", "20": "<p>Stack arrays vertically, horizontally, or along a new axis.</p><div class='code'>np.stack((a,b),axis=0)\nnp.vstack((a,b))\nnp.hstack((a,b))\nnp.dstack((a,b))</div>", "21": "<p>Split arrays into pieces.</p><div class='code'>np.split(x,3)\nnp.array_split(x,3)\nnp.hsplit(matrix,2)\nnp.vsplit(matrix,2)</div>", "22": "<p>NumPy math functions are vectorized.</p><div class='code'>np.abs(x)\nnp.exp(x)\nnp.log(x)\nnp.sqrt(x)\nnp.power(x,2)\nnp.sin(x)\nnp.cos(x)</div>", "23": "<p>Statistical functions support descriptive and relationship analysis.</p><div class='code'>np.mean(x)\nnp.median(x)\nnp.percentile(x,90)\nnp.var(x)\nnp.std(x)\nnp.corrcoef(x,y)</div>", "24": "<p>Analyze marks, attendance, study hours and assignment completion with masks and aggregations.</p><div class='code'>marks=np.array([72,55,91,44,83])\nattendance=np.array([92,68,95,61,88])\npassed=(marks>=50)&amp;(attendance>=75)\nnp.mean(marks[passed])\nnp.mean(attendance)</div>"};

 where:["np.where()",`Think of <code>np.where</code> as array-wide if/else.<br><br><code>np.where(marks &gt;= 50, "Pass", "Fail")
np.where(marks &lt; 50, 0, marks)</code><br><br>With only a condition, it returns matching indices.`],
 unique:["np.unique()",`<code>np.unique(x)</code> returns distinct values. Add <code>return_counts=True</code> to get frequencies.<br><br><code>np.unique(x, return_counts=True)</code>`],
 sorting:["Sorting",`<code>np.sort(x)</code> returns sorted values. <code>np.argsort(x)</code> returns the indices that would sort the array.<br><br><code>x=np.array([40,10,30])
np.sort(x)
np.argsort(x)</code>`],
 extrema:["argmax / argmin",`<code>np.argmax(x)</code> returns the index of the largest value. <code>np.argmin(x)</code> returns the index of the smallest value.<br><br><code>marks=np.array([72,91,66])
np.argmax(marks) # 1
np.argmin(marks) # 2</code>`],
 random:["Random Numbers",`Use the modern random generator API.<br><br><code>rng=np.random.default_rng(42)
rng.integers(1,11,5)
rng.random(5)
rng.normal(70,10,5)
rng.choice(["A","B","C"],5)</code><br><br>A seed makes results reproducible.`],
 broadcasting:["Broadcasting",`Broadcasting lets compatible shapes interact. Compare dimensions from the right: they must match or one must be 1.<br><br><code>a=np.ones((2,3))
b=np.array([10,20,30])
a+b</code><br><br>A scalar such as <code>x+10</code> broadcasts across the whole array.`],
 copyview:["Copy vs View",`A view can share data with the original array. A copy has independent data.<br><br><code>x=np.array([1,2,3,4])
view=x[1:3]
view[0]=99
y=x.copy()</code><br><br>Use <code>copy()</code> when you need independent storage.`],
 combine:["Combining Arrays",`Use <code>np.concatenate</code> to join along an existing axis. <code>column_stack</code> and <code>row_stack</code> are useful for 1-D arrays.<br><br><code>np.concatenate((a,b))
np.column_stack((a,b))
np.row_stack((a,b))</code>`],
 stacking:["Stacking",`<code>np.stack</code> joins along a new axis. <code>vstack</code> is vertical, <code>hstack</code> horizontal and <code>dstack</code> depth.<br><br><code>np.stack((a,b))
np.vstack((a,b))
np.hstack((a,b))</code>`],
 splitting:["Splitting",`<code>np.split</code> makes equal sections. <code>np.array_split</code> can make uneven sections.<br><br><code>np.split(x,3)
np.array_split(x,3)</code>`],
 math:["Mathematical Functions",`NumPy provides vectorized functions such as <code>abs</code>, <code>sqrt</code>, <code>exp</code>, <code>log</code>, <code>power</code>, <code>sin</code> and <code>cos</code>.<br><br><code>np.sqrt(x)
np.log(x)
np.power(x,2)</code>`],
 statistics:["Statistical Functions",`Useful statistics include <code>mean</code>, <code>median</code>, <code>percentile</code>, <code>var</code>, <code>std</code> and <code>corrcoef</code>.<br><br><code>np.mean(marks)
np.percentile(marks,75)
np.std(marks)</code>`],
 student:["Student Data",`Combine Boolean masks and aggregations to analyze marks and attendance.<br><br><code>marks=np.array([72,55,91,44,83])
attendance=np.array([92,68,95,61,88])
passed=(marks &gt;= 50) &amp; (attendance &gt;= 75)
np.mean(marks[passed])</code>`]
};

let tutorHistory=JSON.parse(localStorage.getItem("gn_tutor_history")||"[]");
let tutorQuiz=null;

function tutor(){
 document.getElementById("view").innerHTML='<section><span class="eyebrow">NumPy Tutor</span><h2>Ask Grumpy 🤖</h2><p class="muted">Ask for an explanation, example, practice problem or quiz. Works offline.</p><div class="grid"><div class="card"><h3>📚 Topics</h3><div class="actions">'+Object.keys(TUTOR).map(k=>'<button class="secondary" onclick="tutorTopic(\''+k+'\')">'+TUTOR[k][0]+'</button>').join("")+'</div></div><div class="card"><h3>⚡ Quick start</h3><p>Try <b>Explain axis=1</b>, <b>Show np.where</b>, <b>Why use &amp;?</b>, <b>Give me practice</b> or <b>Quiz me</b>.</p><button class="secondary" onclick="tutorQuizStart()">🧠 Quiz me</button></div></div><div class="chat" id="chat"></div><div class="actions"><input id="tq" style="flex:1" autocomplete="off" placeholder="Ask Grumpy about NumPy"><button class="primary" onclick="askTutor()">Ask</button><button class="secondary" onclick="clearTutor()">Clear</button></div></section>';
 renderTutorHistory();
 const input=document.getElementById("tq");
 input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();askTutor();}});
 input.focus();
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function addTutor(role,html){tutorHistory.push({role:role,html:html});if(tutorHistory.length>50)tutorHistory=tutorHistory.slice(-50);localStorage.setItem("gn_tutor_history",JSON.stringify(tutorHistory));renderTutorHistory();}
function renderTutorHistory(){let c=document.getElementById("chat");if(!c)return;c.innerHTML=tutorHistory.length?tutorHistory.map(m=>'<div class="msg '+m.role+'">'+m.html+'</div>').join(""):'<div class="msg bot"><b>Grumpy:</b> Hey! 🐍 Pick a topic or ask me anything about NumPy.</div>';c.scrollTop=c.scrollHeight;}
function clearTutor(){tutorHistory=[];tutorQuiz=null;localStorage.removeItem("gn_tutor_history");tutor();}

function tutorTopic(key){let t=TUTOR[key];addTutor("user","Teach me <b>"+esc(t[0])+"</b>");addTutor("bot",t[1]+'<br><br><button class="secondary" onclick="tutorPractice(\''+key+'\')">💻 Give me a practice problem</button>');}
function tutorPractice(key){let p={creation:"Create a 2×3 array of zeros and a 2×3 array of ones.",basics:"Create a NumPy array containing [10,20,30,40].",indexing:"For a=np.arange(12).reshape(3,4), select the second column.",reshape:"Reshape np.arange(12) into a 3×4 array.",aggregation:"For marks=[55,72,81,44], calculate the mean.",boolean:"Select marks that are >=50 AND <90.",filtering:"Filter marks to values >=50.",where:"Replace values below 50 with 0 using np.where.",unique:"Return unique values and their counts.",sorting:"Return the indices that would sort x.",extrema:"Return the index of the largest mark.",random:"Create an RNG with seed 42 and generate five integers from 1–10.",broadcasting:"Add [10,20,30] to every row of a 2×3 array.",copyview:"Make an independent copy of x.",combine:"Join a and b using concatenate.",stacking:"Stack a and b vertically.",splitting:"Split x into three flexible parts.",math:"Calculate the square root of every value in x.",statistics:"Calculate the 75th percentile of marks.",student:"Select students with marks >=50 and attendance >=75."}[key]||"Write one NumPy expression using this topic.";addTutor("bot","<b>💻 Practice:</b><br>"+p+"<br><br>Type your solution and I’ll explain the correct pattern.");}
function tutorQuizStart(){let keys=Object.keys(TUTOR),key=keys[Math.floor(Math.random()*keys.length)],t=TUTOR[key];let qs={creation:["Which function creates an array filled with zeros?","np.zeros"],basics:["What does shape tell you?","The size along each dimension"],indexing:["How do you select the second column of a 2-D array a?","a[:,1]"],reshape:["What must stay the same during reshape?","The total number of elements"],aggregation:["What does axis=1 produce for a 2-D reduction?","One result per row"],boolean:["Which operator is element-wise AND?","&"],filtering:["What is Boolean filtering?","Using a Boolean mask to select values"],where:["What does np.where(condition,A,B) do?","Choose A when true and B otherwise"],unique:["Which option gives frequencies in np.unique?","return_counts=True"],sorting:["What does argsort return?","The indices that would sort the array"],extrema:["Does argmax return a value or an index?","An index"],random:["Why use a random seed?","Reproducible results"],broadcasting:["Can a scalar broadcast across an array?","Yes"],copyview:["How do you make an independent copy?","x.copy()"],combine:["Which function joins along an existing axis?","np.concatenate"],stacking:["Which function joins along a new axis?","np.stack"],splitting:["Which function allows uneven splits?","np.array_split"],math:["Which function calculates a square root?","np.sqrt"],statistics:["Which function calculates standard deviation?","np.std"],student:["What operator combines two student conditions element-wise?","&"]};let q=qs[key]||qs.basics;tutorQuiz=q[1];addTutor("bot","<b>🧠 Quiz:</b><br>"+q[0]+"<br><br>Type your answer.");}
function askTutor(){
 let input=document.getElementById("tq");if(!input)return;let q=(input.value||"").trim();if(!q)return;
 addTutor("user",esc(q));input.value="";
 if(tutorQuiz){let u=q.toLowerCase().replace(/\s+/g," ").trim(),a=tutorQuiz.toLowerCase().replace(/\s+/g," ").trim(),ok=u===a||u.includes(a)||a.includes(u);addTutor("bot",ok?"🎉 <b>Correct!</b>":"❌ <b>Not quite.</b> The expected answer is <code>"+esc(tutorQuiz)+"</code>.");tutorQuiz=null;return;}
 let s=q.toLowerCase();
 if(s.includes("quiz")||s.includes("test me")){tutorQuizStart();return;}
 let key=null;
 const aliases={creation:"creation",create:"creation","array creation":"creation","np.zeros":"creation","np.zero":"creation","np.ones":"creation","np.one":"creation","np.full":"creation","np.arange":"creation","np.linspace":"creation",zeros:"creation",zero:"creation",ones:"creation",one:"creation",full:"creation",arange:"creation",linspace:"creation",axis:"aggregation",sum:"aggregation",mean:"aggregation",average:"aggregation",aggregate:"aggregation",where:"where","np.where":"where",unique:"unique","np.unique":"unique",sort:"sorting",sorting:"sorting",argsort:"sorting",argmax:"extrema",argmin:"extrema",random:"random",rng:"random",broadcast:"broadcasting",broadcasting:"broadcasting",copy:"copyview",view:"copyview",stack:"stacking",vstack:"stacking",hstack:"stacking",split:"splitting",sqrt:"math",log:"math",exp:"math",median:"statistics",percentile:"statistics",variance:"statistics",std:"statistics",student:"student",marks:"student",attendance:"student",boolean:"boolean",logical:"boolean",filter:"filtering",mask:"filtering",index:"indexing",slice:"indexing",reshape:"reshape",shape:"reshape",ndarray:"basics",numpy:"basics"};
 Object.keys(aliases).sort((a,b)=>b.length-a.length).some(k=>{if(s.includes(k)){key=aliases[k];return true;}return false;});
 if(!key)key="basics";
 let t=TUTOR[key],prefix="";
 if(s.includes("practice")||s.includes("problem")||s.includes("exercise")){tutorPractice(key);return;}
 if(s.includes("why"))prefix="<b>Why it matters:</b> This is a core NumPy pattern used in numerical analysis and data processing.<br><br>";
 addTutor("bot",prefix+t[1]+"<br><br><b>Quick check:</b> Ask me “quiz me” to test this concept.");
}
